services:
  db:
    image: postgres:18.6-alpine3.24
    container_name: gosocial-postgres-db
    environment:
      POSTGRES_DB: gosocial
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpass
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "5432:5432"

volumes:
  db-data:
